<title id="title">Алгоритм программы сортировки деталей</title>
<desc id="desc">Загрузка позы, ожидание разрешения и пуска, получение кадра, выбор детали, боковой захват, перенос и проверка исчезновения. Соединители 1 и 2 обозначают возврат к ожиданию пуска и к оценке уже полученного кадра; соединитель 3 продолжает алгоритм в правой колонке.</desc>
